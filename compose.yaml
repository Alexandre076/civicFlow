services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow
      POSTGRES_DB: civicflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow -d civicflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      CIVICFLOW_DATABASE_URL: postgresql+psycopg://civicflow:civicflow@db:5432/civicflow
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn civicflow.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert r.status == 200"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  frontend_node_modules:
  backend_venv:
  postgres_data:
